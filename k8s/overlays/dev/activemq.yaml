apiVersion: v1
kind: Service
metadata:
  name: activemq
  labels:
    app.kubernetes.io/name: activemq
    app.kubernetes.io/component: messaging
spec:
  selector:
    app.kubernetes.io/name: activemq
    app.kubernetes.io/component: messaging
  ports:
    - name: openwire
      port: 61616
      targetPort: openwire
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: activemq
  labels:
    app.kubernetes.io/name: activemq
    app.kubernetes.io/component: messaging
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: activemq
      app.kubernetes.io/component: messaging
  template:
    metadata:
      labels:
        app.kubernetes.io/name: activemq
        app.kubernetes.io/component: messaging
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: activemq
          image: apache/activemq-classic:5.19.2
          ports:
            - name: openwire
              containerPort: 61616
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          startupProbe:
            tcpSocket:
              port: openwire
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: openwire
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /opt/apache-activemq/data
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 1Gi
