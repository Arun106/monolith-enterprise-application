name: Deploy to Kubernetes

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment and Kubernetes overlay
        required: true
        type: choice
        options:
          - dev
          - production
      image_tag:
        description: Immutable image tag, normally sha-<40-character commit SHA>
        required: true
        type: string
permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.image_tag }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.36.2

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Configure cluster access
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Select immutable images
        env:
          APPLICATION_IMAGE: ghcr.io/${{ github.repository }}
          MIGRATION_IMAGE: ghcr.io/${{ github.repository }}-migration
          IMAGE_TAG: ${{ inputs.image_tag }}
          OVERLAY: ${{ inputs.environment }}
        run: |
          cd "k8s/overlays/${OVERLAY}"
          kustomize edit set image \
            "ghcr.io/adikarthik/monolith-enterprise-application=${APPLICATION_IMAGE}:${IMAGE_TAG}"
          cd ../../jobs
          kustomize edit set image \
            "ghcr.io/adikarthik/monolith-enterprise-application-migration=${MIGRATION_IMAGE}:${IMAGE_TAG}"

      - name: Verify production prerequisites
        if: inputs.environment == 'production'
        run: kubectl --namespace snowman get secret snowman-secrets

      - name: Apply platform resources
        env:
          OVERLAY: ${{ inputs.environment }}
        run: |
          kustomize build "k8s/overlays/${OVERLAY}" | kubectl apply -f -
          kubectl --namespace snowman delete job snowman-database-migration \
            --ignore-not-found=true

      - name: Run database migration
        run: |
          kustomize build k8s/jobs | kubectl apply -f -
          if ! kubectl --namespace snowman wait \
            --for=condition=complete job/snowman-database-migration --timeout=5m; then
            kubectl --namespace snowman logs \
              job/snowman-database-migration --all-containers=true
            exit 1
          fi

      - name: Verify rollout
        run: |
          kubectl --namespace snowman rollout status \
            deployment/snowman --timeout=5m
          kubectl --namespace snowman get pods,service,ingress

      - name: Roll back failed application rollout
        if: failure()
        run: kubectl --namespace snowman rollout undo deployment/snowman
