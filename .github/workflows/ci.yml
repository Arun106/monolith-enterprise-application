name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Verify application
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: snowman-jar
          path: target/Snowman.jar
          if-no-files-found: error
          retention-days: 14

  container:
    name: Build container images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: snowman:test
          cache-from: type=gha,scope=application
          cache-to: type=gha,mode=max,scope=application

      - name: Build migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.migration
          push: false
          tags: snowman-migration:test
          cache-from: type=gha,scope=migration
          cache-to: type=gha,mode=max,scope=migration

  manifests:
    name: Validate deployment configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.36.2

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Render Kubernetes configurations
        run: |
          kubectl kustomize k8s/overlays/dev > /tmp/snowman-dev.yaml
          kubectl kustomize k8s/overlays/production > /tmp/snowman-production.yaml
          kubectl kustomize k8s/jobs > /tmp/snowman-migration.yaml

      - name: Validate Kubernetes schemas
        run: |
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -summary -kubernetes-version 1.36.0 < /tmp/snowman-dev.yaml
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -summary -kubernetes-version 1.36.0 < /tmp/snowman-production.yaml
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -summary -kubernetes-version 1.36.0 < /tmp/snowman-migration.yaml
